# The website is maintained as complete static HTML, CSS, and JavaScript.
# Keep Jekyll available for the existing GitHub Pages and Cloudflare builds.
# The default output directory remains _site.
theme: null

# Prevent legacy sources and repository-only files from generating output.
exclude:
  - README.md
  - index.md
  - assets/css/style.scss
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
